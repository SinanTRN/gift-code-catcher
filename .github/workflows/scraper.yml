name: Scraper and Auto-Redeem

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    # Yedek tetikleyici. Asıl saatlik tetikleme cron-job.org -> workflow_dispatch ile yapılır.
    # GitHub schedule'ı yoğunlukta gecikir/atlar; saat başı (:00) yerine sakin bir dakika seçildi.
    - cron: '37 */3 * * *'
  workflow_dispatch: # cron-job.org her saat GitHub API üzerinden bunu tetikler (ayrıca Actions sekmesinde manuel buton)

permissions:
  contents: write # Botun seen_codes.json dosyasını repoya geri commit atabilmesi için gerekli izin

# Aynı anda tek çalışma: dispatch ve schedule çakışırsa aynı kod iki kez kullanılmasın.
concurrency:
  group: gift-code-scraper
  cancel-in-progress: false

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Git Repository'yi Çek
        uses: actions/checkout@v4
        with:
          ref: main # Tetiklenme anındaki SHA yerine güncel main; sırada bekleyen çalışma eski seen_codes.json okumasın

      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies (Tesseract OCR)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng

      - name: Gerekli Kütüphaneleri Yükle
        run: pip install -r requirements.txt

      - name: Scraper Scriptini Çalıştır
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Değişiklikleri GitHub'a Kaydet (Commit & Push)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add seen_codes.json
          # Eğer seen_codes.json değiştiyse commit at, değişmediyse hata verme devam et.
          # Push öncesi rebase: çalışma sırasında elle yapılan push'lar botun push'unu bozmasın.
          git diff --quiet && git diff --staged --quiet || (git commit -m "Otomatik Güncelleme: Yeni hediye kodları eklendi" && git pull --rebase origin main && git push)